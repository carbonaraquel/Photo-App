{% extends "base.html" %}

{% block title %}Create Event - Photo-App{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <h2>Create New Event</h2>
    <form method="POST" action="{{ url_for('create_event') }}">
        <div class="form-group">
            <label for="name">Event Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the event..."></textarea>
        </div>
        
        <button type="submit" class="btn btn-success">Create Event</button>
        <a href="{{ url_for('events') }}" class="btn" style="margin-left: 1rem;">Cancel</a>
    </form>
</div>
{% endblock %}
